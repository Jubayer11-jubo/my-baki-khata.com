<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#gradBg)" />
  
  <!-- Outer glowing accent ring -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" />

  <!-- Ledger Book Container -->
  <g filter="url(#shadow)" transform="translate(76, 80)">
    <!-- Left Cover spine edge -->
    <rect x="0" y="8" width="360" height="336" rx="20" fill="#065f46" />
    
    <!-- Open Book Base (White / Cream Pages) -->
    <path d="M 24 16 L 175 16 C 182 16, 185 18, 185 24 L 185 330 C 185 330, 180 326, 172 326 L 24 326 C 16 326, 10 320, 10 312 L 10 30 C 10 22, 16 16, 24 16 Z" fill="#ffffff" />
    <path d="M 336 16 L 185 16 C 178 16, 175 18, 175 24 L 175 330 C 175 330, 180 326, 188 326 L 336 326 C 344 326, 350 320, 350 312 L 350 30 C 350 22, 344 16, 336 16 Z" fill="#f8fafc" />

    <!-- Center Binding Shadow -->
    <rect x="177" y="16" width="6" height="314" fill="#cbd5e1" opacity="0.6" />

    <!-- Left Page Lines (Debit/Credit records) -->
    <rect x="36" y="56" width="120" height="8" rx="4" fill="#10b981" />
    <rect x="36" y="88" width="100" height="6" rx="3" fill="#94a3b8" />
    <rect x="36" y="112" width="115" height="6" rx="3" fill="#cbd5e1" />
    <rect x="36" y="136" width="90" height="6" rx="3" fill="#cbd5e1" />
    <rect x="36" y="160" width="110" height="6" rx="3" fill="#cbd5e1" />
    
    <!-- Left Page Mini Check / Tick icon -->
    <circle cx="50" cy="220" r="14" fill="#d1fae5" />
    <path d="M 44 220 L 48 224 L 56 215" stroke="#059669" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="74" y="217" width="75" height="6" rx="3" fill="#10b981" />

    <!-- Right Page: Taka Currency Badge -->
    <circle cx="265" cy="115" r="54" fill="#ecfdf5" stroke="#10b981" stroke-width="5" />
    <!-- Taka Symbol (৳) nicely drawn -->
    <text x="265" y="136" font-family="'Hind Siliguri', 'Noto Sans Bengali', Arial, sans-serif" font-size="68" font-weight="bold" fill="#047857" text-anchor="middle">৳</text>

    <!-- Right Page Summary Lines -->
    <rect x="210" y="198" width="115" height="8" rx="4" fill="#047857" />
    <rect x="210" y="226" width="85" height="6" rx="3" fill="#94a3b8" />
    <rect x="210" y="248" width="105" height="6" rx="3" fill="#cbd5e1" />

    <!-- Gold Bookmark Ribbon -->
    <path d="M 170 12 L 190 12 L 190 95 L 180 82 L 170 95 Z" fill="url(#goldRibbon)" filter="url(#shadow)" />
  </g>
</svg>
